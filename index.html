<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anuflix — Discover trending movies and TV shows. Browse ratings, cast, and recommendations powered by TMDB.">
    <title>Anuflix — Movies & TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css?v=102">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <div id="app">
        <!-- Sidebar (Desktop) -->
        <aside id="sidebar">
            <a href="#/" class="sidebar-logo">
                <img src="logo.png" alt="Anuflix" class="custom-logo">
                <span class="logo-text">Anuflix</span>
            </a>
            <nav class="sidebar-nav" id="sidebar-nav">
                <a href="#/" class="nav-link active" data-page="home">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Home</span>
                </a>
                <a href="#/movies" class="nav-link" data-page="movies">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/></svg>
                    <span>Movies</span>
                </a>
                <a href="#/tv" class="nav-link" data-page="tv">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                    <span>TV Shows</span>
                </a>
                <a href="#/anime" class="nav-link" data-page="anime">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>
                    <span>Anime</span>
                </a>

                <a href="#/watchlist" class="nav-link" data-page="watchlist">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
                    <span>My List</span>
                </a>
                <a href="#/f1" class="nav-link" data-page="f1">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/></svg>
                    <span>F1 Live</span>
                </a>
            </nav>
            <div class="header-actions">
                <!-- Global Floating Search -->
                <div id="global-search-container" class="global-search-container">
                    <div class="global-search-wrapper">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="global-search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="global-search-input" class="global-search-input" placeholder="Search movies, tv, anime..." autocomplete="off">
                    </div>
                    <div id="global-search-suggestions" class="search-suggestions" style="display: none;"></div>
                </div>
                <a href="https://brave.com/" target="_blank" rel="noopener noreferrer" class="brave-tip">🛡️ For the best ad-free experience, use <strong>Brave Browser</strong></a>
                <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">
                    <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Moon -->
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
            <div class="sidebar-footer">
                <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer" class="tmdb-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Powered by TMDB
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content"></main>

        <!-- Mobile Bottom Navigation -->
        <nav id="mobile-nav">
            <a href="#/" class="mob-link active" data-page="home">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </a>
            <a href="#/movies" class="mob-link" data-page="movies">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
                <span>Movies</span>
            </a>
            <a href="#/tv" class="mob-link" data-page="tv">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                <span>TV</span>
            </a>
            <a href="#/anime" class="mob-link" data-page="anime">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>
                <span>Anime</span>
            </a>

            <a href="#/watchlist" class="mob-link" data-page="watchlist">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
                <span>My List</span>
            </a>
            <a href="#/f1" class="mob-link" data-page="f1">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/></svg>
                <span>F1</span>
            </a>
        </nav>
    </div>

    <!-- API Key Modal -->
    <div id="api-key-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">
                <img src="logo.png" alt="Anuflix" class="custom-logo-large">
            </div>
            <h2>Welcome to Anuflix</h2>
            <p>Enter your free TMDB API key to start exploring movies & TV shows.</p>
            <input type="text" id="api-key-input" placeholder="Paste your API key here…" autocomplete="off" spellcheck="false">
            <button id="api-key-submit" class="btn-primary-full">Get Started</button>
            <p class="modal-help">Get a free key at <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener noreferrer">themoviedb.org/settings/api</a></p>
        </div>
    </div>



    <script src="app.js?v=35"></script>
</body>
</html>
